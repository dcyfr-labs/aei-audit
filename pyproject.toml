[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aei-audit"
dynamic = ["version"]
description = "Audit any O*NET occupation against the Anthropic Economic Index: task-level automation vs augmentation shares, reproducible from public data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DCYFR Labs", email = "hello@dcyfr.ai" }]
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "requests>=2.31"]
keywords = ["anthropic-economic-index", "onet", "labor-economics", "ai-usage", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/dcyfr-labs/aei-audit"
Issues = "https://github.com/dcyfr-labs/aei-audit/issues"

[project.scripts]
aei-audit = "aei_audit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "aei_audit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads the real ~300 MB AEI release; run with -m slow"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/aei_audit/report.py" = ["E501"]  # bibtex author line in CITATION
